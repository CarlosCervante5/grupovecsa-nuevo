<!-- Floating Button -->
<button class="chat-fab" (click)="toggle()" [class.active]="open" aria-label="Asistente virtual">
  <svg *ngIf="!open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <svg *ngIf="open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

<!-- Chat Window -->
<div class="chat-window" *ngIf="open">
  <div class="chat-header">
    <div class="chat-header-info">
      <div class="chat-avatar">V</div>
      <div>
        <span class="chat-name">VECSA Asistente</span>
        <span class="chat-status">En línea</span>
      </div>
    </div>
    <button class="chat-close" (click)="toggle()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="chat-messages">
    <!-- Paso: elegir sucursal -->
    <div class="chat-dealership-step" *ngIf="phase === 'dealership'">
      <div class="chat-welcome-icon">📍</div>
      <p class="chat-dealership-title">¿Con qué sucursal deseas contactar?</p>
      <p class="chat-dealership-hint">Te enlazaremos con el equipo de la sucursal que elijas.</p>
      <div class="chat-dealership-loading" *ngIf="loadingDealerships">Cargando sucursales…</div>
      <div class="chat-dealership-list" *ngIf="!loadingDealerships">
        <button
          type="button"
          class="chat-dealership-btn"
          *ngFor="let d of dealerships"
          (click)="selectDealership(d)"
        >
          <span class="chat-dealership-name">{{ d.name }}</span>
          <span class="chat-dealership-loc" *ngIf="d.location">{{ d.location }}</span>
        </button>
        <p class="chat-dealership-empty" *ngIf="dealerships.length === 0">No hay sucursales disponibles.</p>
      </div>
    </div>

    <!-- Paso: conversación -->
    <ng-container *ngIf="phase === 'chat'">
      <div class="chat-welcome" *ngIf="messages.length === 0">
        <div class="chat-welcome-icon">👋</div>
        <p>¡Hola! Soy el asistente virtual de Grupo VECSA. ¿En qué puedo ayudarte?</p>
      </div>
      <div *ngFor="let msg of messages" class="chat-msg" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
        <div class="chat-bubble">{{ msg.text }}</div>
      </div>
      <div class="chat-msg assistant" *ngIf="sending">
        <div class="chat-bubble chat-typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    </ng-container>
  </div>

  <div class="chat-input-area" *ngIf="phase === 'chat'">
    <input class="chat-input" type="text" placeholder="Escribe tu mensaje..."
      [(ngModel)]="message" (keyup.enter)="send()" [disabled]="sending" />
    <button class="chat-send" (click)="send()" [disabled]="sending || !message.trim()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>
