<div class="campaign-form-sheet">
  <h2 class="campaign-form__title">Nueva Campaña</h2>
  <p class="campaign-form__lead">Por favor, ingrese los datos de la campaña.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="upload-fields-grid">
      <div class="field-group full">
        <label class="field-label" for="campaign-name">Nombre de la campaña *</label>
        <input
          id="campaign-name"
          type="text"
          class="field-input"
          formControlName="name"
          placeholder="Nombre"
          minlength="1"
          maxlength="191"
          required
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="campaign-begin">Inicio de campaña *</label>
        <input id="campaign-begin" type="date" class="field-input" formControlName="begin_date" required />
      </div>

      <div class="field-group">
        <label class="field-label" for="campaign-end">Fin de campaña *</label>
        <input id="campaign-end" type="date" class="field-input" formControlName="end_date" required />
      </div>

      <div class="field-group">
        <label class="field-label" for="campaign-segment">Marca *</label>
        <select id="campaign-segment" class="field-input" formControlName="segment_name">
          <option value="">— Seleccionar —</option>
          <option value="BMW">BMW</option>
          <option value="MINI">MINI</option>
          <option value="MOTORRAD">MOTORRAD</option>
          <option value="Chevrolet">Chevrolet</option>
          <option value="ABcars">ABcars</option>
          <option value="Seminuevos Vecsa">Seminuevos Vecsa</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="campaign-category">Categoría *</label>
        <select id="campaign-category" class="field-input" formControlName="category">
          <option value="">— Seleccionar —</option>
          <option value="vehiculos nuevos">Vehículos nuevos</option>
          <option value="vehiculos seminuevos">Vehículos seminuevos</option>
          <option value="aftersales">Aftersales</option>
        </select>
      </div>

      <div class="field-group full">
        <label class="field-label" for="campaign-description">Descripción</label>
        <input
          id="campaign-description"
          type="text"
          class="field-input"
          formControlName="description"
          placeholder="Descripción"
          minlength="1"
          maxlength="191"
        />
      </div>
    </div>

    <div class="campaign-form__actions">
      <button type="button" class="action-btn" (click)="close()">Cancelar</button>
      <button type="submit" class="action-btn primary-btn" [disabled]="form.invalid">Ingresar</button>
    </div>
  </form>
</div>
