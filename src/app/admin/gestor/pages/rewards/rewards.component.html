<div class="rewards-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Recompensas</h1>
      <p class="page-subtitle">{{ uuids.length }} recompensas registradas</p>
    </div>
    <div class="header-actions">
      <button type="button" class="action-btn primary-btn" (click)="newRewards()">
        <span class="material-icons">add</span>
        Agregar recompensa
      </button>
    </div>
  </div>

  <div class="search-bar">
    <span class="material-icons search-icon">search</span>
    <input
      type="text"
      class="search-input"
      placeholder="Buscar por nombre, descripción o fechas…"
      [(ngModel)]="searchTerm"
      (keyup)="onSearch()"
    />
    <button type="button" class="search-clear" *ngIf="searchTerm" (click)="clearSearch()">
      <span class="material-icons">close</span>
    </button>
  </div>

  <div class="loading-box" *ngIf="loading">
    <app-sk-cube></app-sk-cube>
    <span>Cargando…</span>
  </div>

  <div class="table-wrap" *ngIf="!loading && filtered.length > 0">
    <table class="data-table">
      <thead>
        <tr>
          <th class="th-num">#</th>
          <th>Nombre</th>
          <th>Fecha de inicio</th>
          <th>Fecha de fin</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of filtered; let i = index">
          <td class="cell-num">{{ i + 1 }}</td>
          <td class="cell-strong">{{ row.name }}</td>
          <td>{{ row.begin_date }}</td>
          <td>{{ row.end_date }}</td>
          <td>
            <div class="row-actions">
              <button type="button" class="act-btn edit" (click)="updateReward(row.uuid)" title="Editar">
                <span class="material-icons">edit</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" *ngIf="!loading && filtered.length === 0">
    <span class="material-icons">card_giftcard</span>
    <p *ngIf="uuids.length === 0">No hay recompensas registradas</p>
    <p *ngIf="uuids.length > 0">Ningún resultado con este filtro</p>
  </div>
</div>
