<div class="campaign-form-sheet">
  <h2 class="campaign-form__title">Registrar kilómetros</h2>
  <p class="campaign-form__lead">Por favor, ingrese los datos para registrar el kilometraje.</p>

  <ng-container *ngIf="spinner; else formTemplate">
    <div class="loading-box">
      <app-sk-cube></app-sk-cube>
      <span>Cargando…</span>
    </div>
  </ng-container>

  <ng-template #formTemplate>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="upload-fields-grid">
        <div class="field-group">
          <label class="field-label" for="riderkm-quantity">Cantidad de kilómetros *</label>
          <input
            id="riderkm-quantity"
            type="number"
            class="field-input no-spinner"
            formControlName="quantity"
            placeholder="100"
            min="0"
            required
          />
          <span class="field-error" *ngIf="quantityInvalid">Ingrese la cantidad de kilómetros.</span>
        </div>

        <div class="field-group">
          <label class="field-label" for="riderkm-origin">Área de origen del evento *</label>
          <select id="riderkm-origin" class="field-input" formControlName="origin" required>
            <option value="">— Seleccionar —</option>
            <option value="accesorios">Accesorios</option>
            <option value="lifestyle">LifeStyle</option>
            <option value="refacciones">Refacciones</option>
            <option value="rider">Rider</option>
            <option value="servicio">Servicio</option>
            <option value="hyp">HyP</option>
            <option value="bmw_nuevos">BMW Nuevos</option>
            <option value="mini_nuevos">Mini Nuevos</option>
            <option value="moto_nuevos">Moto Nuevos</option>
            <option value="nuevos">Nuevos</option>
            <option value="seminuevos">Seminuevos</option>
          </select>
          <span class="field-error" *ngIf="originInvalid">Seleccione el área de origen.</span>
        </div>

        <div class="field-group full">
          <label class="field-label" for="riderkm-event">Evento *</label>
          <input
            id="riderkm-event"
            type="text"
            class="field-input"
            formControlName="sale_id"
            placeholder="Octoberfest"
            required
          />
          <span class="field-error" *ngIf="rideNameInvalid">Ingrese el nombre del evento.</span>
        </div>
      </div>

      <div class="campaign-form__actions">
        <button type="button" class="action-btn" (click)="close()">Cancelar</button>
        <button type="submit" class="action-btn primary-btn" [disabled]="form.invalid">Registrar</button>
      </div>
    </form>
  </ng-template>
</div>
