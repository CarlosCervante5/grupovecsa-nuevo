<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <span class="material-icons admin-brand-icon">admin_panel_settings</span>
      <span class="admin-brand-name">{{ overview?.user?.role || 'Admin' }}</span>
    </div>

    <div class="admin-user">
      <div class="admin-user-avatar">{{ name?.charAt(0)?.toUpperCase() || 'U' }}</div>
      <div class="admin-user-info">
        <span class="admin-user-name">{{ name || 'Usuario' }}</span>
        <span class="admin-user-role">{{ role }}</span>
      </div>
    </div>

    <nav class="admin-nav">
      <a class="admin-nav-item" [routerLink]="[url_index?.toString() || '/']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="material-icons">dashboard</span>
        Dashboard
      </a>

      <p class="admin-nav-label" *ngIf="overview?.pages?.length">Módulos</p>
      <a *ngFor="let page of overview?.pages"
        class="admin-nav-item"
        [routerLink]="[page.permalink]"
        routerLinkActive="active">
        <span class="material-icons">{{ getModuleIcon(page.title) }}</span>
        {{ page.title }}
      </a>
    </nav>

    <a class="admin-logout" routerLink="/">
      <span class="material-icons">home</span>
      Ir al inicio
    </a>
    <button class="admin-logout" (click)="logout()">
      <span class="material-icons">logout</span>
      Cerrar sesión
    </button>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <ng-content></ng-content>
  </main>
</div>
