<div class="categories-container">
  <!-- Header -->
  <div class="header">
    <div>
      <h2 class="page-title">Categorías</h2>
      <p class="page-subtitle">Gestión de categorías de la Boutique</p>
    </div>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Nueva categoría
    </button>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar categorías...</mat-label>
      <input matInput [(ngModel)]="search" (keyup.enter)="onSearch()" placeholder="Nombre o descripción">
      <mat-icon matSuffix class="search-icon" (click)="onSearch()">search</mat-icon>
    </mat-form-field>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- Table -->
  <div *ngIf="!loading" class="table-wrapper">
    <table mat-table [dataSource]="categories" class="categories-table">

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
      </ng-container>

      <ng-container matColumnDef="hierarchy">
        <th mat-header-cell *matHeaderCellDef>Jerarquía</th>
        <td mat-cell *matCellDef="let category">{{ categoryHierarchyLabel(category) }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let category">{{ truncateText(category.description) }}</td>
      </ng-container>

      <!-- Active Column -->
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let category">
          <span class="badge" [class.badge-active]="category.active" [class.badge-inactive]="!category.active">
            {{ category.active ? 'Activa' : 'Inactiva' }}
          </span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let category">
          <button mat-icon-button matTooltip="Editar" (click)="openEditDialog(category)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" color="warn" (click)="deleteCategory(category)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- No data row -->
      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No se encontraron categorías
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageIndex]="currentPage - 1"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
