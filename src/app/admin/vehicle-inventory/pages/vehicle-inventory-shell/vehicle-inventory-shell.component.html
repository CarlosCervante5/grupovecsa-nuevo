<div class="panel-layout">
  <aside class="panel-sidebar">
    <div class="panel-brand">
      <span class="material-icons panel-brand-icon">inventory_2</span>
      <span class="panel-brand-name">Inventario de vehículos</span>
    </div>
    <div class="panel-user">
      <div class="panel-user-avatar">{{ name?.charAt(0)?.toUpperCase() || 'V' }}</div>
      <div class="panel-user-info">
        <span class="panel-user-name">{{ name }}</span>
        <span class="panel-user-role">{{ role }}</span>
      </div>
    </div>
    <nav class="panel-nav">
      <a
        class="panel-nav-item"
        routerLink="/admin/vehicle-inventory"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="material-icons">directions_car</span> Listado
      </a>
    </nav>
    <a class="panel-nav-back" [routerLink]="panelHomeUrl">
      <span class="material-icons">arrow_back</span> Volver a mi panel
    </a>
    <button type="button" class="panel-logout" (click)="logout()">
      <span class="material-icons">logout</span> Cerrar sesión
    </button>
  </aside>
  <main class="panel-main">
    <router-outlet></router-outlet>
  </main>
</div>
