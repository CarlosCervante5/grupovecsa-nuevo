<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report ADS - Monitor BMW México</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }
    .header { background: #111; border-bottom: 1px solid #333; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 22px; color: #1877f2; }
    .header .badge { background: #1877f2; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #1877f2; color: white; }
    .btn-primary:hover { background: #1565c0; }
    .btn-secondary { background: #333; color: #ccc; }
    .btn-secondary:hover { background: #444; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    select, input { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 10px 15px; border-radius: 6px; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px; text-align: center; }
    .stat .num { font-size: 32px; font-weight: bold; color: #1877f2; }
    .stat .lbl { color: #888; font-size: 13px; margin-top: 4px; }

    /* Thumbnails */
    .thumb-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
    .thumb:hover { border-color: #1877f2; transform: scale(1.05); }

    /* Lightbox */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 8px; object-fit: contain; }
    .lightbox .lb-close { position: absolute; top: 20px; right: 30px; font-size: 32px; color: white; cursor: pointer; background: none; border: none; z-index: 10000; }
    .lightbox .lb-close:hover { color: #1877f2; }
    .lightbox .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 40px; color: white; cursor: pointer; background: rgba(255,255,255,0.1); border: none; padding: 10px 18px; border-radius: 8px; }
    .lightbox .lb-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox .lb-prev { left: 20px; }
    .lightbox .lb-next { right: 20px; }
    .lightbox .lb-counter { color: #888; margin-top: 12px; font-size: 14px; }
    .lightbox .lb-competitor { color: #1877f2; margin-top: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Report ADS - Monitor BMW México</h1>
    <span class="badge" id="statusBadge">Listo</span>
  </div>
  <div class="container">
    <div class="controls">
      <select id="methodSelect">
        <option value="scraper">🌐 Web Scraper (sin API key)</option>
        <option value="api">🔑 Meta API (requiere token)</option>
      </select>
      <input type="text" id="customSearch" placeholder="Agregar competidor..." style="width:220px">
      <button class="btn btn-primary" id="scanBtn" onclick="startScan()">🔍 Escanear Competidores</button>
      <button class="btn btn-secondary" onclick="loadHistory()">📋 Historial</button>
      <button class="btn btn-secondary" onclick="loadReports()">📄 Reportes</button>
      <button class="btn btn-secondary" onclick="toggleCompetitors()">👥 Competidores</button>
    </div>

    <!-- Panel de competidores -->
    <div id="competitorsPanel" style="display:none;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:20px;margin-bottom:25px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <h2 style="color:#ccc;font-size:18px">👥 Competidores</h2>
        <button class="btn btn-secondary" onclick="toggleCompetitors()" style="padding:6px 12px">✕</button>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:15px">
        <input type="text" id="newCompetitor" placeholder="Nombre del nuevo competidor..." style="flex:1">
        <button class="btn btn-primary" onclick="addCompetitor()">+ Agregar</button>
      </div>
      <div id="competitorsList"></div>
    </div>
    <div class="stats" id="statsContainer" style="display:none">
      <div class="stat"><div class="num" id="statCompetitors">0</div><div class="lbl">Competidores</div></div>
      <div class="stat"><div class="num" id="statAds">0</div><div class="lbl">Anuncios encontrados</div></div>
      <div class="stat"><div class="num" id="statSuccess">0</div><div class="lbl">Exitosos</div></div>
      <div class="stat"><div class="num" id="statErrors">0</div><div class="lbl">Errores</div></div>
    </div>
    <div id="results"></div>
    <div id="loading" style="display:none;text-align:center;padding:40px;color:#888">
      <p style="font-size:18px">⏳ Escaneando competidores...</p>
      <p style="margin-top:10px">Esto puede tardar unos minutos</p>
    </div>
  </div>

  <!-- Lightbox Gallery -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">&times;</button>
    <button class="lb-nav lb-prev" onclick="navLightbox(-1)">&#8249;</button>
    <button class="lb-nav lb-next" onclick="navLightbox(1)">&#8250;</button>
    <img id="lbImage" src="" alt="Ad image">
    <div class="lb-counter" id="lbCounter"></div>
    <div class="lb-competitor" id="lbCompetitor"></div>
  </div>

<script>
// Gallery state
let galleryImages = [];
let galleryIndex = 0;
let galleryCompetitor = '';

function openLightbox(images, index, competitor) {
  galleryImages = images;
  galleryIndex = index;
  galleryCompetitor = competitor;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  galleryIndex = (galleryIndex + dir + galleryImages.length) % galleryImages.length;
  updateLightbox();
}

function updateLightbox() {
  document.getElementById('lbImage').src = galleryImages[galleryIndex];
  document.getElementById('lbCounter').textContent = `${galleryIndex + 1} / ${galleryImages.length}`;
  document.getElementById('lbCompetitor').textContent = galleryCompetitor;
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

// Click outside to close
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

async function startScan() {
  const btn = document.getElementById('scanBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  const method = document.getElementById('methodSelect').value;
  const custom = document.getElementById('customSearch').value.trim();

  btn.disabled = true;
  loading.style.display = 'block';
  results.innerHTML = '';
  document.getElementById('statusBadge').textContent = 'Escaneando...';

  try {
    const body = { method };
    if (custom) {
      const res = await fetch('/api/competitors');
      const competitors = await res.json();
      body.competitors = [...competitors, custom];
    }

    const response = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error);

    showResults(data);

    const histRes = await fetch('/api/history');
    const history = await histRes.json();
    if (history.length) {
      const detailRes = await fetch(`/api/history/${history[0].file}`);
      const detailData = await detailRes.json();
      showAdDetails(detailData);
    }
    document.getElementById('statusBadge').textContent = 'Completado ✅';
  } catch (err) {
    results.innerHTML = `<div style="background:#2a1a1a;border:1px solid #ff4444;border-radius:8px;padding:20px;color:#ff6666"><strong>Error:</strong> ${err.message}</div>`;
    document.getElementById('statusBadge').textContent = 'Error ❌';
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}
</script>
<script>
function showResults(data) {
  const stats = document.getElementById('statsContainer');
  stats.style.display = 'grid';

  const totalAds = data.summary.reduce((s, r) => s + r.adsCount, 0);
  const errors = data.summary.filter(r => r.error).length;

  document.getElementById('statCompetitors').textContent = data.summary.length;
  document.getElementById('statAds').textContent = totalAds;
  document.getElementById('statSuccess').textContent = data.summary.length - errors;
  document.getElementById('statErrors').textContent = errors;

  let html = '<div style="margin-top:20px"><h2 style="color:#ccc;margin-bottom:15px">Resultados del Escaneo</h2>';
  html += '<table style="width:100%;border-collapse:collapse;background:#1a1a1a;border-radius:8px;overflow:hidden">';
  html += '<thead><tr style="background:#1877f2;color:white"><th style="padding:12px 15px;text-align:left">Competidor</th><th style="padding:12px">Anuncios</th><th style="padding:12px">Estado</th></tr></thead><tbody>';

  data.summary.forEach(r => {
    const status = r.error ? `<span style="color:#ff4444">${r.error}</span>` : (r.adsCount > 0 ? '✅ Activo' : '⚪ Sin anuncios');
    html += `<tr style="border-bottom:1px solid #333"><td style="padding:12px 15px">${r.competitor}</td><td style="padding:12px;text-align:center">${r.adsCount}</td><td style="padding:12px">${status}</td></tr>`;
  });

  html += '</tbody></table>';

  if (data.files) {
    html += '<div style="margin-top:20px;display:flex;gap:10px">';
    html += `<a href="${data.files.html}" target="_blank" class="btn btn-primary" style="text-decoration:none;display:inline-block">📄 Ver Reporte HTML</a>`;
    html += `<a href="${data.files.csv}" download class="btn btn-secondary" style="text-decoration:none;display:inline-block">📊 Descargar CSV</a>`;
    html += '</div>';
  }

  html += '</div>';
  document.getElementById('results').innerHTML = html;
}

function showAdDetails(data) {
  const container = document.getElementById('results');
  let html = container.innerHTML;
  html += '<h2 style="color:#ccc;margin:25px 0 15px">Detalle de Anuncios</h2>';

  // Store all gallery data globally
  window.galleryData = {};

  data.forEach((result, ri) => {
    if (!result.ads || !result.ads.length) return;

    const allImages = [];
    result.ads.forEach(ad => {
      (ad.images || []).forEach(src => allImages.push(src));
    });

    const galleryId = 'g' + ri;
    window.galleryData[galleryId] = allImages;

    html += `<h3 style="color:#1877f2;margin:15px 0 10px">${result.competitor} (${result.adsFound} anuncios) — ${allImages.length} imágenes</h3>`;
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-bottom:20px">';

    result.ads.slice(0, 10).forEach((ad, i) => {
      const adImages = ad.images || [];

      let thumbsHtml = '<div class="thumb-grid">';
      adImages.slice(0, 4).forEach(src => {
        const idx = allImages.indexOf(src);
        thumbsHtml += `<img class="thumb" src="${src}" loading="lazy" onerror="this.style.display='none'" onclick="openLightbox(window.galleryData['${galleryId}'], ${idx}, '${result.competitor.replace(/'/g, "\\'")}')" alt="Ad thumbnail">`;
      });
      if (adImages.length > 4) {
        thumbsHtml += `<div style="width:80px;height:80px;background:#222;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1877f2;font-weight:bold" onclick="openLightbox(window.galleryData['${galleryId}'], ${allImages.indexOf(adImages[4])}, '${result.competitor.replace(/'/g, "\\'")}')">+${adImages.length - 4}</div>`;
      }
      thumbsHtml += '</div>';

      html += `<div style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:15px">
        <div style="font-weight:bold;color:#1877f2;margin-bottom:8px">Anuncio #${i+1}</div>
        ${thumbsHtml}
        <div style="color:#ccc;font-size:14px;line-height:1.4">${(ad.text||'').substring(0,200)}</div>
        <div style="display:flex;gap:8px;margin-top:8px;font-size:12px;color:#888">
          <span style="background:#222;padding:3px 8px;border-radius:4px">📷 ${ad.imageCount||0}</span>
          <span style="background:#222;padding:3px 8px;border-radius:4px">🎥 ${ad.videoCount||0}</span>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

async function loadHistory() {
  const results = document.getElementById('results');
  try {
    const res = await fetch('/api/history');
    const history = await res.json();
    if (!history.length) { results.innerHTML = '<p style="color:#888;padding:20px">No hay escaneos previos.</p>'; return; }

    let html = '<h2 style="color:#ccc;margin-bottom:15px">Historial de Escaneos</h2><div style="display:grid;gap:10px">';
    history.forEach(h => {
      html += `<div style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:15px;display:flex;justify-content:space-between;align-items:center"><span>${h.date}</span><span style="color:#888">${h.file}</span></div>`;
    });
    html += '</div>';
    results.innerHTML = html;
  } catch (err) {
    results.innerHTML = `<p style="color:#ff4444">Error: ${err.message}</p>`;
  }
}

function toggleCompetitors() {
  const panel = document.getElementById('competitorsPanel');
  const visible = panel.style.display !== 'none';
  panel.style.display = visible ? 'none' : 'block';
  if (!visible) refreshCompetitorsList();
}

async function refreshCompetitorsList() {
  const list = document.getElementById('competitorsList');
  try {
    const res = await fetch('/api/competitors');
    const competitors = await res.json();
    list.innerHTML = competitors.map(c => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#111;border:1px solid #333;border-radius:6px;margin-bottom:6px">
        <span>${c}</span>
        <button onclick="removeCompetitor('${c.replace(/'/g, "\\'")}')" style="background:none;border:none;color:#ff4444;cursor:pointer;font-size:18px;padding:0 6px" title="Eliminar">&times;</button>
      </div>
    `).join('');
  } catch (err) {
    list.innerHTML = `<p style="color:#ff4444">Error: ${err.message}</p>`;
  }
}

async function addCompetitor() {
  const input = document.getElementById('newCompetitor');
  const name = input.value.trim();
  if (!name) return;
  try {
    const res = await fetch('/api/competitors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    input.value = '';
    refreshCompetitorsList();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function removeCompetitor(name) {
  if (!confirm(`¿Eliminar "${name}" de la lista?`)) return;
  try {
    const res = await fetch(`/api/competitors/${encodeURIComponent(name)}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    refreshCompetitorsList();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function loadReports() {
  const results = document.getElementById('results');
  try {
    const res = await fetch('/api/reports');
    const reports = await res.json();
    if (!reports.length) { results.innerHTML = '<p style="color:#888;padding:20px">No hay reportes generados.</p>'; return; }

    let html = '<h2 style="color:#ccc;margin-bottom:15px">Reportes Generados</h2><div style="display:grid;gap:10px">';
    reports.forEach(r => {
      const icon = r.endsWith('.html') ? '📄' : '📊';
      html += `<a href="/reports/${r}" target="_blank" style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:15px;text-decoration:none;color:#e0e0e0;display:block">${icon} ${r}</a>`;
    });
    html += '</div>';
    results.innerHTML = html;
  } catch (err) {
    results.innerHTML = `<p style="color:#ff4444">Error: ${err.message}</p>`;
  }
}
</script>
</body>
</html>
