# Railway producción (rama grupovecsaFrontendRailway) — build production + serve estático.
# Rama sandbox: usar buildCommand = "npm run build" (environment.sandbox.ts).

[build]
builder = "nixpacks"
# No repetir npm ci aquí; nixpacks.toml ya instala en [phases.install]
buildCommand = "npm run prod"

[deploy]
startCommand = "npm start"
