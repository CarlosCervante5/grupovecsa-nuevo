<!-- Top Bar -->
<div id="top-bar" class="bg-gray-900 text-white py-2 text-sm hidden md:block">
  <div class="container mx-auto px-4 md:px-6 lg:px-8 flex justify-between items-center">
    <div class="flex items-center space-x-6">
      <span class="flex items-center">
        <i class="fas fa-phone-alt mr-2"></i>
        222-555-0123
      </span>
      <span class="flex items-center">
        <i class="fas fa-envelope mr-2"></i>
        contacto&#64;grupovecsa.com
      </span>
    </div>
    <div class="flex items-center space-x-4">
      <a href="https://x.com/bmwmotorrad" target="_blank" class="hover:text-gray-300 transition-colors"><i class="fab fa-twitter"></i></a>
      <a href="https://www.facebook.com/BMWMotorrad.Mex" target="_blank" class="hover:text-gray-300 transition-colors"><i class="fab fa-facebook-f"></i></a>
      <a href="https://www.pinterest.com.mx/bmwmotorrad/" target="_blank" class="hover:text-gray-300 transition-colors"><i class="fab fa-pinterest"></i></a>
      <a href="https://www.instagram.com/bmwmotorradmexico/" target="_blank" class="hover:text-gray-300 transition-colors"><i class="fab fa-instagram"></i></a>
    </div>
  </div>
</div>

<!-- Header -->
<header id="main-header" class="sticky top-0 left-0 right-0 z-50 bg-white shadow-md transition-all duration-300">
  <div class="container mx-auto px-4 md:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 lg:h-20">
      
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a [routerLink]="['/']" class="text-2xl lg:text-3xl font-bold text-gray-800 tracking-tight">
          GRUPO VECSA
        </a>
      </div>
      
      <!-- Desktop Navigation -->
      <nav class="lg:flex items-center space-x-8">
        <a routerLink="/compra-tu-auto" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">Vehículos</a>
        <a routerLink="/boutique" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">Boutique</a>
        <a routerLink="/rewards" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">Rewards</a>
        <a routerLink="/experience" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">Experience</a>
        <a routerLink="/car-care" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">Car Care</a>
        <a routerLink="/promociones" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">Promociones</a>
      </nav>
      
      <!-- Right Side Actions & Mobile Menu -->
      <div class="flex items-center space-x-4">
        <!-- Session Management -->
        <ng-container *ngIf="isLoggedIn; else showLogin">
          <button mat-button [matMenuTriggerFor]="menu" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium flex items-center">
            <img [src]="user?.profile?.picture || 'assets/iconos_avatares/default-avatar.png'" alt="Avatar" class="w-6 h-6 rounded-full mr-2 border border-white/20">
            <span *ngIf="user?.profile?.name as userName">{{ userName.split(' ')[0] }}</span>
          </button>
          <mat-menu #menu="matMenu">
            <a mat-menu-item routerLink="/auth/account/profile">Mi Perfil</a>
            <a mat-menu-item (click)="logout()">Cerrar Sesión</a>
          </mat-menu>
        </ng-container>
        <ng-template #showLogin>
          <a routerLink="/auth/login" class="text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">Iniciar Sesión</a>
        </ng-template>

        <!-- Mobile Menu Button -->
        <button class="lg:hidden text-gray-800 hover:text-gray-900">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </div>
    </div>
  </div>
</header>
