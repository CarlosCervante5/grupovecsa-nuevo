<div class="avatar-picker">
  <header class="avatar-picker__header">
    <div class="avatar-picker__heading">
      <h2>Elegir avatar</h2>
      <p>Selecciona un ícono de la colección o toma una foto para tu perfil.</p>
    </div>
    <button type="button" class="avatar-picker__close" (click)="onClose()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="avatar-picker__toolbar" *ngIf="!cameraActive && !capturedImage">
    <div class="avatar-picker__toolbar-row">
      <span class="avatar-picker__label">Clasificación</span>
      <button type="button" class="avatar-picker__camera" (click)="openCamera()">
        <mat-icon>photo_camera</mat-icon>
        <span>Abrir cámara</span>
      </button>
    </div>
    <div class="avatar-picker__filters" role="tablist" aria-label="Filtrar avatares">
      <button
        type="button"
        role="tab"
        class="avatar-picker__filter"
        [class.avatar-picker__filter--active]="selectedCategory === 'todos'"
        [attr.aria-selected]="selectedCategory === 'todos'"
        (click)="filtrarIconos('todos')">
        Todos
      </button>
      <button
        type="button"
        role="tab"
        class="avatar-picker__filter"
        [class.avatar-picker__filter--active]="selectedCategory === 'autos'"
        [attr.aria-selected]="selectedCategory === 'autos'"
        (click)="filtrarIconos('autos')">
        Vehículos
      </button>
      <button
        type="button"
        role="tab"
        class="avatar-picker__filter"
        [class.avatar-picker__filter--active]="selectedCategory === 'motos'"
        [attr.aria-selected]="selectedCategory === 'motos'"
        (click)="filtrarIconos('motos')">
        Motos
      </button>
    </div>
  </div>

  <section class="avatar-picker__camera" *ngIf="cameraActive">
    <div class="avatar-picker__camera-frame">
      <video #videoElement autoplay muted playsinline></video>
      <p class="avatar-picker__camera-hint">{{ mensaje || 'Centra tu rostro en el marco. La foto se tomará en unos segundos.' }}</p>
    </div>
  </section>

  <section class="avatar-picker__preview" *ngIf="capturedImage && !cameraActive">
    <img [src]="capturedImage" alt="Vista previa de tu foto" class="avatar-picker__preview-img" />
    <div class="avatar-picker__preview-actions">
      <button type="button" class="avatar-picker__btn avatar-picker__btn--primary" (click)="confirmPhoto()">Confirmar foto</button>
      <button type="button" class="avatar-picker__btn avatar-picker__btn--secondary" (click)="retakePhoto()">Volver a tomar</button>
      <button type="button" class="avatar-picker__btn avatar-picker__btn--ghost" (click)="cancelPhoto()">Cancelar</button>
    </div>
  </section>

  <section class="avatar-picker__body" *ngIf="!cameraActive && !capturedImage">
    <div class="avatar-picker__grid">
      <button
        type="button"
        class="avatar-picker__item"
        *ngFor="let icon of filteredIcons"
        [class.avatar-picker__item--selected]="selectedIcon === icon.src"
        (click)="setIcon(icon.src)"
        [attr.aria-label]="'Seleccionar avatar'">
        <img [src]="icon.src" alt="" loading="lazy" />
      </button>
    </div>
    <p class="avatar-picker__empty" *ngIf="filteredIcons.length === 0">No hay avatares en esta categoría.</p>
  </section>

  <footer class="avatar-picker__footer" *ngIf="!cameraActive && !capturedImage">
    <button
      type="button"
      class="avatar-picker__submit"
      (click)="enviarIcon()"
      [disabled]="!iconButton">
      <mat-icon>check_circle</mat-icon>
      Seleccionar avatar
    </button>
  </footer>
</div>
