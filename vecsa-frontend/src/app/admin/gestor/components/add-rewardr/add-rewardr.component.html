<div class="campaign-form-sheet">
  <h2 class="campaign-form__title">Nueva recompensa</h2>
  <p class="campaign-form__lead">Por favor, ingrese los datos de la recompensa.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="upload-fields-grid">
      <div class="field-group full">
        <label class="field-label" for="reward-name">Título del reward *</label>
        <input
          id="reward-name"
          type="text"
          class="field-input"
          formControlName="name"
          placeholder="Nuevo título"
          minlength="1"
          maxlength="191"
          required
        />
      </div>

      <div class="field-group full">
        <label class="field-label" for="reward-description">Descripción *</label>
        <input
          id="reward-description"
          type="text"
          class="field-input"
          formControlName="description"
          placeholder="Descripción"
          minlength="1"
          maxlength="191"
          required
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="reward-begin">Fecha de inicio *</label>
        <input id="reward-begin" type="date" class="field-input" formControlName="begin_date" required />
      </div>

      <div class="field-group">
        <label class="field-label" for="reward-end">Fecha de fin *</label>
        <input id="reward-end" type="date" class="field-input" formControlName="end_date" required />
      </div>
    </div>

    <div class="campaign-form__actions">
      <button type="button" class="action-btn" (click)="close()">Cancelar</button>
      <button type="submit" class="action-btn primary-btn" [disabled]="form.invalid">Guardar</button>
    </div>
  </form>
</div>
