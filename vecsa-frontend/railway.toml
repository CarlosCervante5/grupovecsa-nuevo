# Railway sandbox/producción — SPA Angular (build sandbox + serve estático).
# Si el dashboard define otro Start Command, alinéalo con `npm start` o borra startCommand aquí.

[build]
builder = "nixpacks"
# No repetir npm ci aquí; nixpacks.toml ya instala en [phases.install]
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
